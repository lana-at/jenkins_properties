plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.0.2'
}

group = 'ru.dev'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def selenideVersion = "7.13.0",
    allureVersion = "2.32.0",
    junitVersion = "5.14.1",
    slf4jVersion = "2.0.17"

allure {
    report {//секция репорта
        version.set("2.29.0")
    }
    adapter {
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set(allureVersion) //версия интеграция фреймворка и аллюр
            }
        }

    }

}

dependencies {
    testImplementation(
            "com.codeborne:selenide:$selenideVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "io.qameta.allure:allure-junit5:$allureVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion"
    )


}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}
